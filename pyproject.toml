[project]
name = "fibersoft_ai"
authors = [{ name = "Fibersoft", email = "support@fibersoft.online" }]
description = "Fibersoft AI - context-aware AI assistant for Fibersoft ERP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
